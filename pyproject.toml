[project]
name = "multi-agent-service"
version = "4.2.0"
description = "Multi-Agent System for freelance automation and cold outreach"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Framework
    "litestar[standard]>=2.0",

    # Orchestration
    "langgraph>=1.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.0",              # Valkey-compatible client
    "pgvector>=0.3",

    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Browser automation
    "playwright>=1.40",
    "playwright-stealth>=1.0",

    # Geo
    "h3>=4.0",

    # HTTP & Email
    "httpx>=0.27",
    "aiosmtplib>=3.0",

    # Monitoring
    "prometheus-client>=0.21",
    "sentry-sdk[litestar]>=2.0",

    # Security
    "cryptography>=43.0",
    "pyjwt>=2.9",
    "bcrypt>=4.0",

    # Email validation (for Pydantic EmailStr)
    "email-validator>=2.0",

    # Telegram bot
    "python-telegram-bot>=21.0",

    # Utilities
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "black>=24.0",
    "locust>=2.30",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
line-length = 120
