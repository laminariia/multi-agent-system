x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mas}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    tmpfs:
      - /tmp:size=256m
      - /run:size=64m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: >
      valkey-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${VALKEY_PASSWORD:-changeme}
    volumes:
      - valkey_data:/data
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging: *default-logging

  api:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: >
      sh -c "alembic upgrade head && litestar --app src.api.main:app run --host 0.0.0.0 --port 8000 --workers 2"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
      VALKEY_URL: valkey://default:${VALKEY_PASSWORD:-changeme}@valkey:6379
    tmpfs:
      - /tmp:size=128m
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
    logging: *default-logging

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: python -m src.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
      VALKEY_URL: valkey://default:${VALKEY_PASSWORD:-changeme}@valkey:6379
    tmpfs:
      - /tmp:size=256m
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
    logging: *default-logging

  bot:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: python -m src.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
      VALKEY_URL: valkey://default:${VALKEY_PASSWORD:-changeme}@valkey:6379
    tmpfs:
      - /tmp:size=64m
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging: *default-logging

  dashboard:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}-dashboard:latest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3000
      API_URL: ${PUBLIC_URL:-http://localhost}
      NODE_ENV: production
    tmpfs:
      - /tmp:size=64m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    tmpfs:
      - /tmp:size=64m
      - /var/cache/nginx:size=128m
      - /var/run:size=16m
      - /var/log/nginx:size=64m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - ssl
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.1
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - backend
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  valkey-exporter:
    image: oliver006/redis_exporter:v1.58.0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=valkey:6379
      - REDIS_PASSWORD=${VALKEY_PASSWORD:-changeme}
    networks:
      - backend
    depends_on:
      - valkey
    deploy:
      resources:
        limits:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
    networks:
      - backend
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging: *default-logging

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  valkey_data:
  certbot-conf:
  certbot-www:
  prometheus_data:
  grafana_data:
