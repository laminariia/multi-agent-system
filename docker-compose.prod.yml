services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  api:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}:latest
    restart: unless-stopped
    command: >
      litestar --app src.api.main:app run
      --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
      VALKEY_URL: valkey://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}:latest
    restart: unless-stopped
    command: python -m src.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
      VALKEY_URL: valkey://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  bot:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-mas}:latest
    restart: unless-stopped
    command: python -m src.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mas}
      VALKEY_URL: valkey://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

volumes:
  postgres_data:
  valkey_data:
  ssl_certs:
