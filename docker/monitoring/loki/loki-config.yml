# Loki 3.x Configuration for MAS
# Log aggregation with tiered retention per deploy-spec.md
#
# Retention tiers:
#   API access logs:    30 days
#   Agent activity:     90 days
#   Error logs:        180 days
#   Security/audit:    365 days

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

ingester:
  wal:
    dir: /loki/wal
  chunk_encoding: snappy
  chunk_idle_period: 1h
  chunk_target_size: 1572864  # 1.5 MB
  chunk_retain_period: 30s
  max_transfer_retries: 0

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  retention_period: 2160h  # 90 days (default fallback)
  max_query_parallelism: 2
  max_global_streams_per_user: 10000
  retention_stream:
    # API access logs — 30 days
    - selector: '{log_type="access"}'
      priority: 1
      period: 720h
    # Agent activity — 90 days
    - selector: '{log_type="agent"}'
      priority: 2
      period: 2160h
    # Error logs — 180 days
    - selector: '{level="error"}'
      priority: 3
      period: 4320h
    - selector: '{level="critical"}'
      priority: 3
      period: 4320h
    # Security/audit logs — 365 days
    - selector: '{log_type="security"}'
      priority: 4
      period: 8760h
    - selector: '{log_type="audit"}'
      priority: 4
      period: 8760h

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

querier:
  max_concurrent: 4

analytics:
  reporting_enabled: false
