# MAS Monitoring Stack — Loki + Promtail + Grafana (extended)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker/docker-compose.monitoring.yml up -d
#
# This file adds Loki log aggregation and Promtail log scraping
# to the existing production monitoring stack (Prometheus + Grafana).
#
# It does NOT duplicate services from docker-compose.prod.yml.
# Grafana is extended via additional volume mounts for alerting provisioning.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ──────────────────────────────────────────────
  # Loki — Log Aggregation (Grafana Loki 3.x)
  # ──────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    container_name: mas-loki
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Promtail — Log Collector (scrapes all MAS containers)
  # ──────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.4.2
    container_name: mas-promtail
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker socket for container discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker container logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Application log files (if mounted on host)
      - mas_app_logs:/var/log/mas:ro
      # Promtail positions (track where we left off)
      - promtail_positions:/tmp
    tmpfs:
      - /run:size=16m
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
    logging: *default-logging

  # ──────────────────────────────────────────────
  # Grafana — Extended with Loki datasource + alerting
  # Merges with the grafana service from docker-compose.prod.yml
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Core
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Unified Alerting (Grafana 11.x)
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      # SMTP for email alerts
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${SMTP_HOST:-localhost:587}
      - GF_SMTP_USER=${SMTP_USER:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM:-grafana@mas.local}
      - GF_SMTP_FROM_NAME=MAS Alerts
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # Server
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # Feature toggles
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  backend:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-mas}_backend

volumes:
  loki_data:
    driver: local
  promtail_positions:
    driver: local
  mas_app_logs:
    driver: local
  grafana_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-mas}_grafana_data
