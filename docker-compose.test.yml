# Docker Compose configuration for running E2E tests.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   pytest tests/e2e/dashboard/ -v --timeout=120
#   docker compose -f docker-compose.test.yml down
#
services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: mas-test-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas_test_password
      POSTGRES_DB: mas_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /home/postgres/pgdata/data

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: mas-test-valkey
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mas-test-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://mas:mas_test_password@postgres:5432/mas_test
      VALKEY_URL: valkey://valkey:6379
      JWT_SECRET_KEY: e2e-test-jwt-secret-key-must-be-32-chars
      ENCRYPTION_KEY: e2e-test-encryption-key
      OPENROUTER_API_KEY: test-key
      ENVIRONMENT: test
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: mas-test-dashboard
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
