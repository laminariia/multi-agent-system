# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 1: Lint — fast feedback on code quality
  # ═══════════════════════════════════════════════════════════════════════
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "ruff>=0.8"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2a: Unit Tests — fast, no external services
  # ═══════════════════════════════════════════════════════════════════════
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          # Dummy values — unit tests mock all external calls
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          VALKEY_URL: valkey://localhost:6379
          OPENROUTER_API_KEY: test-key
          JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-long
          ENCRYPTION_KEY: ci-test-encryption-key
        run: |
          pytest tests/unit/ \
            -v --tb=short -x \
            --timeout=120 \
            --cov=src \
            --cov-fail-under=70 \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit-unit.xml

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 7

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2b: Golden Set — LLM output regression tests (prompt changes)
  # ═══════════════════════════════════════════════════════════════════════
  test-golden:
    name: Golden Set Regression
    runs-on: ubuntu-latest
    needs: lint
    if: >
      contains(github.event.head_commit.message, '[golden]') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run golden set tests
        run: >
          python -m pytest tests/golden_set/ -m golden -v
          --tb=short
          --junit-xml=junit-golden.xml

      - name: Upload golden set results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-golden
          path: junit-golden.xml
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2c: Integration Tests — requires DB and cache services
  # ═══════════════════════════════════════════════════════════════════════
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: mas
          POSTGRES_PASSWORD: mas_ci_password
          POSTGRES_DB: mas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://mas:mas_ci_password@localhost:5432/mas_test
        run: python -m alembic upgrade head

      - name: Alembic check (no pending migrations)
        env:
          DATABASE_URL: postgresql://mas:mas_ci_password@localhost:5432/mas_test
        run: python -m alembic check

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://mas:mas_ci_password@localhost:5432/mas_test
          VALKEY_URL: valkey://localhost:6379
          OPENROUTER_API_KEY: test-key
          JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-long
          ENCRYPTION_KEY: ci-test-encryption-key
        run: |
          pytest tests/integration/ \
            -v --tb=short -x \
            --timeout=300 \
            --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --junitxml=junit-integration.xml

      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-integration
          path: junit-integration.xml
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 2c: Security — runs in parallel with tests
  # ═══════════════════════════════════════════════════════════════════════
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    # Runs parallel to tests (no needs: test-*)
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep scan
        uses: semgrep/semgrep-action@713efdd6114b6faab7a78e3e4000cf38f8129e5a # v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e7b4b01e007f0be3 # v0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          sarif_file: trivy-fs.sarif

      - name: Gitleaks secrets detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 3: E2E Tests — full environment with Playwright
  # ═══════════════════════════════════════════════════════════════════════
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    timeout-minutes: 30

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: mas
          POSTGRES_PASSWORD: mas_ci_password
          POSTGRES_DB: mas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://mas:mas_ci_password@localhost:5432/mas_test
        run: python -m alembic upgrade head

      # Start API server in background
      - name: Start API server
        env:
          DATABASE_URL: postgresql://mas:mas_ci_password@localhost:5432/mas_test
          VALKEY_URL: valkey://localhost:6379
          OPENROUTER_API_KEY: test-key
          JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-long
          ENCRYPTION_KEY: ci-test-encryption-key
        run: |
          litestar --app src.api.main:app run --host 0.0.0.0 --port 8000 &
          # Wait for API to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break || sleep 2
          done

      # Start dashboard in background
      - name: Start dashboard
        working-directory: dashboard
        env:
          API_URL: http://localhost:8000
        run: |
          PORT=3000 npx remix-serve ./build/server/index.js &
          sleep 5

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000
        run: |
          pytest tests/e2e/ \
            -v --tb=short \
            --timeout=300 \
            --junitxml=junit-e2e.xml

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-e2e
          path: junit-e2e.xml
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 4: Coverage — merge and upload all coverage reports
  # ═══════════════════════════════════════════════════════════════════════
  coverage:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download unit coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-unit

      - name: Download integration coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-integration

      - name: Upload to Codecov
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        with:
          files: coverage-unit.xml,coverage-integration.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 5: Build Docker images (main branch only)
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20

    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      dashboard_image: ${{ steps.meta-dashboard.outputs.tags }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- API image --
      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # -- Dashboard image --
      - name: Extract Dashboard image metadata
        id: meta-dashboard
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Dashboard image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: dashboard
          file: dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      # -- Trivy scan on built images --
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947e7b4b01e007f0be3 # v0.31.0
        with:
          image-ref: ${{ steps.meta-api.outputs.tags }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH

      - name: Upload API image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

  # ═══════════════════════════════════════════════════════════════════════
  # STAGE 6: Deploy via Railway (main branch only, after build)
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Deploy Dashboard to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach --service dashboard --path-as-root dashboard

      # Health check after deploy
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}/api/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Notify success via Telegram
        if: success()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="*MAS Deployed*%0ACommit: \`${GITHUB_SHA::7}\`%0ABranch: \`${{ github.ref_name }}\`%0AStatus: OK"

      - name: Notify failure via Telegram
        if: failure()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="*MAS Deploy FAILED*%0ACommit: \`${GITHUB_SHA::7}\`%0ABranch: \`${{ github.ref_name }}\`%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
