# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Notification

on:
  # Triggered after CI/CD deploy completes, or manually
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_health_check:
        description: "Skip health check (useful for debugging)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    name: Health Check & Notify
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded or was manually dispatched
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5

    steps:
      - name: Health check — API
        id: health
        if: ${{ github.event.inputs.skip_health_check != 'true' }}
        run: |
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL secret not set, skipping health check"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for i in $(seq 1 6); do
            RESPONSE=$(curl -sf -w "\n%{http_code}" "$PRODUCTION_URL/health" 2>/dev/null || echo -e "\n000")
            BODY=$(echo "$RESPONSE" | head -n -1)
            STATUS=$(echo "$RESPONSE" | tail -1)

            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              echo "status=healthy" >> "$GITHUB_OUTPUT"
              echo "body=$BODY" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          echo "::error::Health check failed after 6 attempts"

      - name: Send Telegram notification (success)
        if: steps.health.outputs.status == 'healthy' || steps.health.outputs.status == 'skipped'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping notification"
            exit 0
          fi

          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          ACTOR="${{ github.event.workflow_run.actor.login || github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id || github.run_id }}"

          TEXT="*MAS Deploy OK*
          Commit: \`$SHORT_SHA\`
          Branch: \`$BRANCH\`
          By: $ACTOR
          [View run]($RUN_URL)"

          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            -d text="$TEXT"

      - name: Send Telegram notification (failure)
        if: steps.health.outputs.status == 'unhealthy'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping notification"
            exit 0
          fi

          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id || github.run_id }}"

          TEXT="*MAS Deploy UNHEALTHY*
          Commit: \`$SHORT_SHA\`
          Branch: \`$BRANCH\`
          Health check failed after deployment.
          [View run]($RUN_URL)"

          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            -d text="$TEXT"

          exit 1

  notify-failed-deploy:
    name: Notify Failed Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 2

    steps:
      - name: Send Telegram failure notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping notification"
            exit 0
          fi

          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"

          TEXT="*MAS CI/CD FAILED*
          Commit: \`$SHORT_SHA\`
          Branch: \`${{ github.event.workflow_run.head_branch }}\`
          Pipeline failed before deployment.
          [View run]($RUN_URL)"

          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            -d text="$TEXT"
