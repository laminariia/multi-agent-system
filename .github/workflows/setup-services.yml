# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Reusable workflow: Test Services Setup
#
# Provides PostgreSQL 16 (TimescaleDB) and Valkey 8.1 service containers
# along with Python setup and dependency installation.
#
# Usage in calling workflow:
#   jobs:
#     my-test-job:
#       uses: ./.github/workflows/setup-services.yml
#       with:
#         python-version: "3.12"
#         run-migrations: true
#         test-command: "pytest tests/integration/ -v --timeout=300"
#
name: Reusable Test Services

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      run-migrations:
        description: "Run Alembic migrations before tests"
        type: boolean
        default: true
      test-command:
        description: "The pytest command to run"
        type: string
        required: true
      timeout-minutes:
        description: "Job timeout in minutes"
        type: number
        default: 20
      upload-coverage:
        description: "Upload coverage report as artifact"
        type: boolean
        default: false
      coverage-artifact-name:
        description: "Name for the coverage artifact"
        type: string
        default: "coverage"

env:
  DATABASE_URL: postgresql://mas:mas_ci_password@localhost:5432/mas_test
  VALKEY_URL: valkey://localhost:6379
  OPENROUTER_API_KEY: test-key
  JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-long
  ENCRYPTION_KEY: ci-test-encryption-key

jobs:
  test-with-services:
    name: Test with Services
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: mas
          POSTGRES_PASSWORD: mas_ci_password
          POSTGRES_DB: mas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        if: ${{ inputs.run-migrations }}
        run: python -m alembic upgrade head

      - name: Run tests
        run: ${{ inputs.test-command }}

      - name: Upload coverage artifact
        if: ${{ inputs.upload-coverage && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: "*.xml"
          retention-days: 7
